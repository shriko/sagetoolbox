name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/SageToolbox/SageToolbox.csproj -c Release -p:Version=$VERSION -o publish
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/SageToolbox.exe
          generate_release_notes: true
